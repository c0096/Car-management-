services:
  db:
    build:
      context: ./db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=VehicleDeclarationsDb;User Id=sa;Password=YourStrong!Passw0rd;Encrypt=True;TrustServerCertificate=True"
      Uploads__RootPath: "/app/storage/uploads"
      Auth__DefaultEmail: "admin@example.com"
      Auth__DefaultPassword: "Admin123!"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-uploads:/app/storage/uploads

  adminer:
    build:
      context: ./adminer
    environment:
      ADMINER_DEFAULT_SERVER: "db"
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mssql-data:
  app-uploads:
